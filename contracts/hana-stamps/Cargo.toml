[package]
name = "hana-stamps"
description = "Journear Passport hackathon demo: passport stamps a user's NEAR account collects, most through gasless meta transactions"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.9"
serde = { version = "1", features = ["derive"] }
borsh = { version = "1.3.1", features = ["unstable__schema"] }
schemars = "0.8.16"

[dev-dependencies]
near-sdk = { version = "5.9", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Standalone crate (not part of any parent workspace).
[workspace]
