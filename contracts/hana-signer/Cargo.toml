[package]
name = "hana-signer"
description = "Hana ID: OIDC sessions, per-app scope registry and NEAR MPC confidential key derivation"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.9"
serde = { version = "1", features = ["derive"] }
borsh = { version = "1.3.1", features = ["unstable__schema"] }
schemars = "0.8.16"
base64 = "0.22"
num-bigint = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
near-sdk = { version = "5.9", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# The unit tests generate RSA test keys (src/test_rsa.rs) and verify many RS256 signatures: big-integer arithmetic
# unoptimised is slow. Test builds only; the wasm uses the release profile above.
[profile.dev.package.num-bigint]
opt-level = 3
