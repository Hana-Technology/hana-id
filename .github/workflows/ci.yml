name: CI

# Free only while the repository is public and every job runs on a standard GitHub-hosted runner (`ubuntu-latest`);
# a larger runner is billed even for a public repository (D857; docs/operations.md "CI and git").
# scripts/test/workflows.test.ts holds every workflow to that: standard runners, actions pinned to commits, no
# pull_request_target, read-only permissions at the top, small artifacts kept at most 3 days, a timeout on every job.
#
# Pull requests (a fork's included) run with `pull_request`: a read-only GITHUB_TOKEN and no secrets. No job here reads
# a secret, and every checkout leaves no credentials behind (persist-credentials: false).
on:
  pull_request:
  push:
    branches: [develop, next, main]
  # Everything, all three browsers.
  workflow_dispatch:
  # No schedule (D857, amending D383): GitHub runs a schedule only on the default branch (`develop`), and the pushes
  # after a merge now run WebKit and Firefox themselves.

permissions:
  contents: read

# A newer push to the same branch, or to the same PR, cancels the run it supersedes. A push is measured from the last
# successful push run on its branch, so the cancelled run's changes are tested by the next one.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (supply-chain safety); the comment gives the tag.
jobs:
  # Which jobs this change needs (D383; scripts/ci-changes.mjs, docs/operations.md "CI and git"). A push is measured
  # from the head of the last successful push run on its branch, so a cancelled or failed run's changes count again;
  # a PR from its base.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # gh run list: the last successful push run on the branch
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      web: ${{ steps.changes.outputs.web }}
      evm: ${{ steps.changes.outputs.evm }}
      playwright_args: ${{ steps.changes.outputs.playwright_args }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Base commit
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push)
              base=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$BRANCH" --event push \
                --status success --limit 1 --json headSha --jq '.[0].headSha // ""') || base="" ;;
            *) base="" ;;
          esac
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Classify
        id: changes
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_BASE: ${{ steps.base.outputs.sha }}
        run: node scripts/ci-changes.mjs

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks binary (MIT) needs no license, unlike the gitleaks GitHub Action on org repos.
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full history
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml --exit-code 1 .
      # The config must catch this repo's own secret shapes (security sweep OPER-2): fakes generated at run time,
      # scanned with the same binary and config; no dependencies, so no install step.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Self-test the rules on generated fakes
        run: node scripts/secret-scan-selftest.mjs ./gitleaks

  # Known vulnerabilities in the locked dependencies (scripts/dep-audit.mjs, security sweep OPER-9): on every event,
  # since an advisory can appear without any change here.
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install cargo-audit (checksum-verified)
        env:
          CARGO_AUDIT_VERSION: 0.22.2
          CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
        run: |
          curl -sSfL -o cargo-audit.tgz "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${CARGO_AUDIT_VERSION}/cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}.tgz"
          echo "${CARGO_AUDIT_SHA256}  cargo-audit.tgz" | sha256sum -c -
          tar -xzf cargo-audit.tgz --strip-components=1 -C "$HOME/.cargo/bin" "cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}/cargo-audit"
          rm cargo-audit.tgz
      - run: node scripts/dep-audit.mjs

  contract:
    name: Contract (cargo test + wasm)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts/hana-signer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # rustup installs the toolchain pinned in rust-toolchain.toml (incl. wasm32 target) on first use.
      - run: rustup show active-toolchain
      # Saved by pushes only: a PR restores its base branch's cache and adds none (the repository's 10 GB, D857).
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: |
            contracts/hana-signer
            contracts/hana-guestbook
            contracts/hana-stamps
          save-if: ${{ github.event_name == 'push' }}
      # Prebuilt release binary, checksum-verified (building it needs Rust >= 1.93 and libudev, and takes ~15 min).
      - name: Install cargo-near
        working-directory: .
        env:
          CARGO_NEAR_VERSION: 0.22.0
          CARGO_NEAR_SHA256: 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
        run: |
          curl -sSfL -o cargo-near.tar.gz "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/cargo-near-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_NEAR_SHA256}  cargo-near.tar.gz" | sha256sum -c -
          tar -xzf cargo-near.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" cargo-near-x86_64-unknown-linux-gnu/cargo-near
          rm cargo-near.tar.gz
          cargo near --version
      - run: cargo test --locked
      - run: cargo near build non-reproducible-wasm
      - name: Wasm size
        run: ls -l target/near/hana_signer.wasm
      # The hackathon demo guestbook (D744), with its own Cargo.lock and toolchain.
      - name: Guestbook tests
        working-directory: contracts/hana-guestbook
        run: cargo test --locked
      - name: Guestbook wasm
        working-directory: contracts/hana-guestbook
        run: cargo near build non-reproducible-wasm
      # The passport stamps demo (D796), the same way.
      - name: Stamps tests
        working-directory: contracts/hana-stamps
        run: cargo test --locked
      - name: Stamps wasm
        working-directory: contracts/hana-stamps
        run: cargo near build non-reproducible-wasm

  # The EVM delegate (D841), as `pnpm verify`'s `evm` step: the formatting, its Foundry tests, then the checked-in
  # artifacts and test vector against the build. Its Solidity dependencies are workspace packages (pnpm install).
  evm:
    name: EVM delegate (forge fmt, test + artifacts check)
    needs: changes
    if: needs.changes.outputs.evm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts/evm-delegate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      # No pnpm cache: this filtered install must not save a partial store under the lockfile's shared cache key.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: ''
      - run: pnpm install --frozen-lockfile --filter @hana-id/evm-delegate...
        working-directory: .
      # The Foundry the repo documents (contracts/evm-delegate/README.md): the release's Linux tarball, checksum-verified
      # (GitHub's digest of the release asset, re-computed on download 2026-11-18); solc 0.8.28 is fetched by forge on
      # first use. Bumping Foundry means re-pinning both values here and in the TypeScript job.
      - name: Install Foundry (checksum-verified)
        working-directory: .
        env:
          FOUNDRY_VERSION: 1.5.1
          FOUNDRY_SHA256: 73640b01bd9ed29fdb4965085099371f8cf0dbbec3e2086cf54564efc4dcfe88
        run: |
          curl -sSfL -o foundry.tar.gz "https://github.com/foundry-rs/foundry/releases/download/v${FOUNDRY_VERSION}/foundry_v${FOUNDRY_VERSION}_linux_amd64.tar.gz"
          echo "${FOUNDRY_SHA256}  foundry.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.foundry/bin"
          tar -xzf foundry.tar.gz -C "$HOME/.foundry/bin" forge cast anvil
          rm foundry.tar.gz
          "$HOME/.foundry/bin/forge" --version | grep -F "Version: ${FOUNDRY_VERSION}-"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
      - run: forge fmt --check
      - run: forge test
      - run: node scripts/generate.mjs --check

  typescript:
    name: TypeScript (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # anvil and cast for the EVM deploy tests (D849), which skip without them, as on a machine without Foundry, and
      # for the anvil lane (D868, required here). The same pinned release as the evm job.
      - name: Install Foundry (checksum-verified)
        working-directory: .
        env:
          FOUNDRY_VERSION: 1.5.1
          FOUNDRY_SHA256: 73640b01bd9ed29fdb4965085099371f8cf0dbbec3e2086cf54564efc4dcfe88
        run: |
          curl -sSfL -o foundry.tar.gz "https://github.com/foundry-rs/foundry/releases/download/v${FOUNDRY_VERSION}/foundry_v${FOUNDRY_VERSION}_linux_amd64.tar.gz"
          echo "${FOUNDRY_SHA256}  foundry.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.foundry/bin"
          tar -xzf foundry.tar.gz -C "$HOME/.foundry/bin" forge cast anvil
          rm foundry.tar.gz
          "$HOME/.foundry/bin/forge" --version | grep -F "Version: ${FOUNDRY_VERSION}-"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      # EVM gas sponsorship on a local anvil (D868): the real handlers, relayer object and delegate bytecode, as
      # `pnpm verify`'s anvil lane runs it. Required: the job installs anvil above.
      - run: pnpm --filter @hana-id/api run test:anvil
        env:
          HANA_ANVIL_REQUIRED: '1'

  # Packs @hana-id/core, web, react and sodax, checks the tarballs, installs them with npm into a project outside the
  # workspace, type-checks and imports them there (scripts/pack-check.ts). Publishes nothing.
  packages:
    name: SDK packages (pack check)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run pack:check

  playwright:
    name: Playwright
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/e2e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # The browsers Playwright 1.64.1 pins, with their system libraries: only the ones this run tests.
      - name: Install the browsers
        env:
          PLAYWRIGHT_ARGS: ${{ needs.changes.outputs.playwright_args }}
        run: |
          read -ra browsers <<< "${PLAYWRIGHT_ARGS//--project /}"
          if [ "${#browsers[@]}" -eq 0 ]; then pnpm run e2e:install; else pnpm exec playwright install --with-deps "${browsers[@]}"; fi
      # The suite builds the vault and auth bundles for its local env and starts the local stack itself. Chromium on
      # PRs; all three after a merge (a push to next, develop or main) and on manual runs (D857).
      - name: Playwright
        id: e2e
        env:
          PLAYWRIGHT_ARGS: ${{ needs.changes.outputs.playwright_args }}
        run: |
          read -ra args <<< "$PLAYWRIGHT_ARGS"
          pnpm run e2e --forbid-only "${args[@]}"
      # On a failure only, and small (D857): the HTML report with the failed tests' traces (the config records no video
      # and no screenshots; test-results/ holds the same traces again, so it is not uploaded). About 1 MB plus a few
      # MB per failed attempt; over 25 MB the traces are dropped and the report and error contexts kept.
      - name: Cap the report's size
        if: failure() && steps.e2e.outcome == 'failure'
        run: |
          [ -d playwright-report ] || exit 0
          du -sh playwright-report
          if [ "$(du -sk playwright-report | cut -f1)" -gt 25600 ]; then
            find playwright-report -name '*.zip' -delete
            echo "::notice::The Playwright report was over 25 MB: traces dropped; run the failing test locally for its trace."
            du -sh playwright-report
          fi
      - name: Upload the report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: apps/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  e2e:
    name: Sandbox e2e (near-workspaces)
    needs: [changes, contract]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: contracts/integration-tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        # The governance sandbox tests rebuild the v2 contract from an older commit (git archive, V2_COMMIT), so
        # this job needs the history, not a shallow clone.
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show active-toolchain
      # The tests build hana-signer, mock-mpc, hana-guestbook and hana-stamps with their own pinned toolchain.
      - run: rustup toolchain install 1.85.1 --target wasm32-unknown-unknown --profile minimal
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: |
            contracts/integration-tests
            contracts/hana-signer
            contracts/mock-mpc
            contracts/hana-guestbook
            contracts/hana-stamps
          save-if: ${{ github.event_name == 'push' }}
      # Prebuilt release binary, checksum-verified (building it needs Rust >= 1.93 and libudev, and takes ~15 min).
      - name: Install cargo-near
        working-directory: .
        env:
          CARGO_NEAR_VERSION: 0.22.0
          CARGO_NEAR_SHA256: 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
        run: |
          curl -sSfL -o cargo-near.tar.gz "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/cargo-near-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_NEAR_SHA256}  cargo-near.tar.gz" | sha256sum -c -
          tar -xzf cargo-near.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" cargo-near-x86_64-unknown-linux-gnu/cargo-near
          rm cargo-near.tar.gz
          cargo near --version
      # The binary near-workspaces would otherwise fetch unchecked from S3 at test time (security sweep OPER-8): the one
      # near-sandbox's DEFAULT_NEAR_SANDBOX_VERSION names. scripts/test/release-supply-chain.test.ts ties the crate
      # version to Cargo.lock: bumping the crate means re-pinning both values here.
      - name: Install near-sandbox (checksum-verified)
        working-directory: .
        env:
          NEAR_SANDBOX_CRATE: 0.3.16
          NEAR_SANDBOX_VERSION: 2.13.4
          NEAR_SANDBOX_SHA256: 5690a4635172263cf026683f75965cac09dd916912584f12709974fed620163f
        run: |
          curl -sSfL -o near-sandbox.tar.gz "https://s3-us-west-1.amazonaws.com/build.nearprotocol.com/nearcore/Linux-x86_64/${NEAR_SANDBOX_VERSION}/near-sandbox.tar.gz"
          echo "${NEAR_SANDBOX_SHA256}  near-sandbox.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/near-sandbox"
          tar -xzf near-sandbox.tar.gz --strip-components=1 -C "$HOME/near-sandbox" Linux-x86_64/near-sandbox
          rm near-sandbox.tar.gz
          chmod +x "$HOME/near-sandbox/near-sandbox"
          echo "NEAR_SANDBOX_BIN_PATH=$HOME/near-sandbox/near-sandbox" >> "$GITHUB_ENV"
      # 8 tests at a time, each on its own sandbox node, as `pnpm verify` runs them (D423; scripts/verify.mjs
      # SANDBOX_TEST_THREADS). Measured on the 16-core dev Mac; on a 4-vCPU runner watch for startup or RPC timeouts.
      - run: cargo test --locked -- --test-threads=8
      # Then the API's NEAR meta-transaction and stamps tests on the same binary and the stamps wasm the tests above
      # built (apps/api test-sandbox/, D731), as verify's sandbox lane: required here, so a missing binary fails.
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm --filter @hana-id/api run test:sandbox
        working-directory: .
        env:
          HANA_SANDBOX_REQUIRED: '1'
