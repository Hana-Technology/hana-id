packages:
  - apps/*
  - packages/*
  - scripts

# Block packages published less than 7 days ago (in minutes): supply-chain protection, as in other Hana repos.
minimumReleaseAge: 10080

allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
  secp256k1: false
  # apps/e2e: Stellar Wallets Kit's wallet SDKs, used only in browser bundles; none of their install scripts is needed.
  '@reown/appkit': false
  blake-hash: false
  bufferutil: false
  protobufjs: false
  tiny-secp256k1: false
  usb: false
  utf-8-validate: false
