name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  # Nightly on develop (the default branch): WebKit and Firefox, which pushes skip (D383).
  schedule:
    - cron: '41 3 * * *'
  # Everything, all three browsers.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (supply-chain safety); the comment gives the tag.
jobs:
  # Which jobs this change needs (D383; scripts/ci-changes.mjs, docs/operations.md "CI and git"). A push is measured
  # from the head of the last successful push run on its branch, so a cancelled or failed run's changes count again;
  # a PR from its base; the nightly run from the last successful nightly run.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      web: ${{ steps.changes.outputs.web }}
      playwright_args: ${{ steps.changes.outputs.playwright_args }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Base commit
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push|schedule)
              base=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$BRANCH" --event "$EVENT" \
                --status success --limit 1 --json headSha --jq '.[0].headSha // ""') || base="" ;;
            *) base="" ;;
          esac
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Classify
        id: changes
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_BASE: ${{ steps.base.outputs.sha }}
        run: node scripts/ci-changes.mjs

  secrets:
    name: Secret scan (gitleaks)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # The gitleaks binary (MIT) needs no license, unlike the gitleaks GitHub Action on org repos.
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full history
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml --exit-code 1 .
      # The config must catch this repo's own secret shapes (security sweep OPER-2): fakes generated at run time,
      # scanned with the same binary and config; no dependencies, so no install step.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Self-test the rules on generated fakes
        run: node scripts/secret-scan-selftest.mjs ./gitleaks

  contract:
    name: Contract (cargo test + wasm)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts/hana-signer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # rustup installs the toolchain pinned in rust-toolchain.toml (incl. wasm32 target) on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: contracts/hana-signer
      # Prebuilt release binary, checksum-verified (building it needs Rust >= 1.93 and libudev, and takes ~15 min).
      - name: Install cargo-near
        working-directory: .
        env:
          CARGO_NEAR_VERSION: 0.22.0
          CARGO_NEAR_SHA256: 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
        run: |
          curl -sSfL -o cargo-near.tar.gz "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/cargo-near-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_NEAR_SHA256}  cargo-near.tar.gz" | sha256sum -c -
          tar -xzf cargo-near.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" cargo-near-x86_64-unknown-linux-gnu/cargo-near
          rm cargo-near.tar.gz
          cargo near --version
      - run: cargo test --locked
      - run: cargo near build non-reproducible-wasm
      - name: Wasm size
        run: ls -l target/near/hana_signer.wasm

  typescript:
    name: TypeScript (typecheck + tests)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  # Packs @hana-id/core, web, react and sodax, checks the tarballs, installs them with npm into a project outside the
  # workspace, type-checks and imports them there (scripts/pack-check.ts). Publishes nothing.
  packages:
    name: SDK packages (pack check)
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run pack:check

  playwright:
    name: Playwright
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/e2e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # The browsers Playwright 1.64.1 pins, with their system libraries: only the ones this run tests.
      - name: Install the browsers
        env:
          PLAYWRIGHT_ARGS: ${{ needs.changes.outputs.playwright_args }}
        run: |
          browsers="${PLAYWRIGHT_ARGS//--project /}"
          if [ -z "$browsers" ]; then pnpm run e2e:install; else pnpm exec playwright install --with-deps $browsers; fi
      # The suite builds the vault and auth bundles for its local env and starts the local stack itself. Chromium on
      # PRs and develop pushes, WebKit and Firefox nightly, all three on main and manual runs (D383).
      - run: pnpm run e2e $PLAYWRIGHT_ARGS
        env:
          PLAYWRIGHT_ARGS: ${{ needs.changes.outputs.playwright_args }}
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7

  e2e:
    name: Sandbox e2e (near-workspaces)
    needs: [changes, contract]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: contracts/integration-tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        # The governance sandbox tests rebuild the v2 contract from an older commit (git archive, V2_COMMIT), so
        # this job needs the history, not a shallow clone.
        with:
          fetch-depth: 0
      - run: rustup show active-toolchain
      # The tests build hana-signer and mock-mpc with their own pinned toolchain.
      - run: rustup toolchain install 1.85.1 --target wasm32-unknown-unknown --profile minimal
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: |
            contracts/integration-tests
            contracts/hana-signer
            contracts/mock-mpc
      # Prebuilt release binary, checksum-verified (building it needs Rust >= 1.93 and libudev, and takes ~15 min).
      - name: Install cargo-near
        working-directory: .
        env:
          CARGO_NEAR_VERSION: 0.22.0
          CARGO_NEAR_SHA256: 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
        run: |
          curl -sSfL -o cargo-near.tar.gz "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/cargo-near-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_NEAR_SHA256}  cargo-near.tar.gz" | sha256sum -c -
          tar -xzf cargo-near.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" cargo-near-x86_64-unknown-linux-gnu/cargo-near
          rm cargo-near.tar.gz
          cargo near --version
      # 8 tests at a time, each on its own sandbox node, as `pnpm verify` runs them (D423; scripts/verify.mjs
      # SANDBOX_TEST_THREADS). Measured on the 16-core dev Mac; on a 4-vCPU runner watch for startup or RPC timeouts.
      - run: cargo test --locked -- --test-threads=8
