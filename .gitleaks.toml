# gitleaks config: default rules, this repo's own secret shapes, narrow allowlists. Used by the pre-commit hook and CI
# (full history). The default rules miss every Hana secret format (security sweep OPER-2): scripts/gitleaks-selftest.mjs
# generates a fake of each at test time and checks these rules catch it (scripts/test/gitleaks.test.ts, the CI
# `secrets` job). Never commit a real or fake key literally to test this file.
title = "hana-id"

[extend]
useDefault = true

# NEAR ed25519 secret keys: `ed25519:` + base58 of the 64-byte seed ‖ public key (87-88 characters), as
# @near-js KeyPair.toString(), ~/.near-credentials, .secrets/<env>/*.json and the RELAYER_KEYS / OWNER_RELAYER_KEYS /
# KEYS_UPDATER_KEY / WATCHDOG_KEY values hold them. Public keys (`ed25519:` + 32 bytes, ~44 characters) are too short
# to match, so docs and manifests may name them.
[[rules]]
id = "near-ed25519-secret-key"
description = "NEAR ed25519 secret key"
regex = '''\bed25519:([1-9A-HJ-NP-Za-km-z]{80,90})\b'''
secretGroup = 1
entropy = 3.5
keywords = ["ed25519:"]

# VAULT_KEK / VAULT_KEK_PREVIOUS values: `<key id>:<base64 of 32 bytes>`, as scripts/lib/vault-kek.ts writes them to
# .secrets/<env>/vault-kek and apps/api/src/vault/kek.ts parses them. Placeholders (`1:<base64>`) don't match.
[[rules]]
id = "hana-vault-kek"
description = "Hana VAULT_KEK value"
regex = '''(?:^|[^0-9A-Za-z+/])([1-9][0-9]{0,8}:[A-Za-z0-9+/]{43}=)(?:[^0-9A-Za-z+/=]|$)'''
secretGroup = 1
entropy = 4.0

# A Worker secret assigned a value, as in apps/api/.dev.vars (gen-wrangler --dev-vars), apps/watchdog's .dev.vars or a
# pasted `wrangler secret` line. A value with `<`, `>` or `…` in it (a doc placeholder) doesn't match.
[[rules]]
id = "hana-worker-secret-assignment"
description = "Hana Worker secret assigned a value (.dev.vars line)"
regex = '''(?m)^[ \t]*(?:export[ \t]+)?(?:RELAYER_KEYS|OWNER_RELAYER_KEYS|HOME_RELAYER_KEYS|KEYS_UPDATER_KEY|VAULT_KEK|VAULT_KEK_PREVIOUS|WATCHDOG_KEY|WATCHDOG_STATUS_TOKEN|RESEND_API_KEY|SLACK_WEBHOOK_URL|HEARTBEAT_URL|PAGER_TOKEN|IDENTITY_SIGNING_KEY|IDENTITY_SIGNING_KEY_STANDBY|IDENTITY_SUB_KEY|IDENTITY_SEAL_KEY|IDENTITY_SEAL_KEY_PREVIOUS|EMAIL_CONSENT_KEY|ISSUER_SIGNING_KEY|EMAIL_SUB_KEY|EMAIL_CODE_KEY|EMAIL_RL_KEY|SENDGRID_API_KEY|EMAIL_API_KEY|USER_ID_KEY)[ \t]*=[ \t]*([^\s<>…]{16,})'''
secretGroup = 1
entropy = 3.5
keywords = ["relayer_keys", "keys_updater_key", "vault_kek", "watchdog_key", "watchdog_status_token", "resend_api_key", "slack_webhook_url", "heartbeat_url", "pager_token", "identity_signing_key", "identity_sub_key", "identity_seal_key", "email_consent_key", "issuer_signing_key", "email_sub_key", "email_code_key", "email_rl_key", "user_id_key", "sendgrid_api_key", "email_api_key"]

# A private JWK's `d`: an EC P-256 or OKP key (32 bytes, 43 base64url characters), as the identity token's signing keys
# are kept (.secrets/<env>/identity-signing-key*.json, IDENTITY_SIGNING_KEY*), or an RSA key (2048-4096 bits, 342-683
# characters), as the email issuer's are (.secrets/<env>/email-issuer-signing-key*.json, ISSUER_SIGNING_KEY). Public
# JWKs (the JWKS, the manifest's identityToken and emailIssuer publicKeys) have no `d` and pass. The member is matched quoted
# (JSON) or unquoted (a JS/TS object literal, `d: '…'`), with any quote around the value.
[[rules]]
id = "hana-private-jwk"
description = "Private JWK (d member)"
regex = '''(?:"d"|'d'|\bd)[ \t]*:[ \t]*["'`]([A-Za-z0-9_-]{43}|[A-Za-z0-9_-]{300,700})["'`]'''
secretGroup = 1
entropy = 3.5
keywords = ["\"d\"", "'d'", "d:", "d :"]

# A Postgres connection string with a password, as the usage ledger's are kept (.secrets/<env>/neon.json,
# neon-usage-writer.url, neon-usage-admin.url; batch C4): 8 characters or more. The entropy floor is 3.0 bits per
# character (8 distinct characters reach exactly 3.0, so 3.5 would make anything under 12 characters unmatchable);
# placeholders (`<password>`, `…`, low-entropy words) and the repo's marked fakes (stopwords) pass.
[[rules]]
id = "hana-postgres-url"
description = "Postgres connection string with a password"
regex = '''postgres(?:ql)?://[A-Za-z0-9_.-]+:([^@\s<>…'"]{8,})@'''
secretGroup = 1
entropy = 3.0
keywords = ["postgres://", "postgresql://"]
[[rules.allowlists]]
description = "Test and doc placeholders that say they are fake"
stopwords = ["not-real", "not-a-real", "placeholder", "fake-pw", "sekrit"]  # sekrit: an earlier commit's test fake

# A Neon API key (`napi_` + letters and digits, as Neon's console shows a new key), as .secrets/<env>/neon-api-key holds
# it for `usage-setup <env> roles` (D403): pasted into a doc or a script. Placeholders (`napi_<key>`, `napi_…`) don't
# match.
[[rules]]
id = "hana-neon-api-key"
description = "Neon API key"
regex = '''\b(napi_[A-Za-z0-9]{40,128})\b'''
secretGroup = 1
entropy = 3.5
keywords = ["napi_"]

# Hana's secret files, whatever they contain: anything under a .secrets/ directory (the council key files
# .secrets/<env>/council/<account>.json included), .dev.vars, the relayer and keys-updater key files, the watchdog's
# secrets file, the vault KEK files, the identity token's and the email issuer's key files, the issuer's and the admin
# Worker's SendGrid keys, the ledger's Neon files (neon.json, the role URLs, the Neon API key neon-api-key, D403), the
# Cloudflare API tokens cloudflare-access-token (D409) and cloudflare-hyperdrive-token (D412),
# wherever they are. All gitignored; this catches `git add -f` and copies. (A Cloudflare token's content is a plain
# 40-character string with no prefix of its own, too generic for a content rule; gitleaks' default `cloudflare-api-key`
# rule catches it next to the word "cloudflare".)
[[rules]]
id = "hana-secret-file"
description = "Hana secret file (.secrets/, .dev.vars, key files, vault KEK)"
path = '''(^|/)(\.secrets/|\.dev\.vars$|(owner-|home-)?relayer-keys\.json$|keys-updater\.json$|watchdog-secrets\.json$|vault-kek(\.previous|\.next)?$|identity-signing-key(-standby)?\.json$|identity-(sub|seal)-key$|email-consent-key$|email-issuer-signing-key(-standby)?\.json$|email-(sub|code|rl)-key$|(email-issuer|admin)-sendgrid-key$|user-id-key$|neon(-usage-(writer|admin)\.url|\.json|-api-key)$|cloudflare-(access|hyperdrive)-token$)'''

# Contract test fixtures: Google-style ID tokens signed by a throwaway RSA key whose private half is discarded
# (contracts/hana-signer/scripts/gen-fixtures.mjs). Only the `jwt` rule is waived here; any other secret in the
# file still fails.
[[allowlists]]
description = "Test-only JWT fixtures"
targetRules = ["jwt"]
paths = ['''^contracts/hana-signer/src/test_fixture\.json$''']

# Console layout vectors (packages/console-core/scripts/gen-vectors.mjs): link tokens and their hashes computed under
# fixed fake keys written in the file itself (32 bytes of 0x11, 0x22, 0x33). Only the generic rule is waived, only
# for this generated file; any other secret shape in it still fails.
[[allowlists]]
description = "Test-only console layout vectors (fixed fake keys)"
targetRules = ["generic-api-key"]
paths = ['''^packages/console-core/test/vectors\.json$''']

# Hana ID publishable test keys (`pk_test_` + base58): public by design, shipped in partner pages, protected by the
# app's origins (docs/integration.md section 1). Only the generic rule is waived, only for a whole match of that
# shape; `pk_live_` keys and every other key shape still fail.
[[allowlists]]
description = "Hana ID publishable test keys (public)"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^pk_test_[1-9A-HJ-NP-Za-km-z]{16,64}$''']

# A Cloudflare Access application's AUD tag in a manifest (`admin.accessAud`, written by `access-setup
# --write-manifest`, D409): 64 hex, public by design (it is the `aud` of every Access JWT the application issues).
# Only the generic rule is waived, only in `envs/*.json`, only for a whole `"accessAud": "<64 hex>"` line.
[[allowlists]]
description = "Cloudflare Access AUD tags in env manifests (public)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)envs/[^/]+\.json$''']
regexTarget = "line"
regexes = ['''^\s*"accessAud": "[0-9a-f]{64}",?\s*$''']

# The self-test's source names secret files and key helpers (`'keys-updater.json': keyFile(…)`), which the generic rule
# reads as assignments; it holds no secret (every fake is generated at run time). Only the generic rule is waived, so a
# real key pasted into it still fails the custom rules.
[[allowlists]]
description = "Secret-scan self-test source (generic rule only)"
targetRules = ["generic-api-key"]
paths = ['''^scripts/secret-scan-selftest\.mjs$''']

# Build output and dependencies (only seen by directory scans; both are gitignored).
[[allowlists]]
description = "Build output and dependencies"
paths = ['''(^|/)target/''', '''(^|/)node_modules/''', '''(^|/)\.wrangler/''']
