[package]
name = "integration-tests"
description = "End-to-end tests of hana-signer (with mock-mpc) in a local NEAR sandbox (near-workspaces)"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
near-workspaces = "=0.23.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
# near-crypto 0.37.4 pins aws-lc-rs =1.16.2; rustls >= 0.23.46 needs aws-lc-rs ^1.18. Not used directly.
rustls = { version = ">=0.23, <0.23.46", default-features = false }

# RSA key generation is slow unoptimised.
[profile.dev.package."*"]
opt-level = 2

# Standalone crate (not part of any parent workspace).
[workspace]
