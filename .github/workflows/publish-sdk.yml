name: Publish SDK packages

# Publishes @hana-id/core, web, react and sodax (docs/operations.md "Releasing the SDK packages"). Manual dispatch
# only, from main. Inert until all of these hold:
#   - the NPM_TOKEN secret exists (the `gate` job skips everything else without it);
#   - the four packages no longer say `"private": true` (npm refuses to publish a private package);
#   - the registry, access and licence decisions in docs/operations.md are made.
# Dry run is the default. Provenance (npm --provenance, signed through this workflow's OIDC token) needs a public
# source repository; see docs/operations.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish; must equal the four package.json versions (e.g. 0.1.0)
        required: true
        type: string
      dist_tag:
        description: npm dist-tag (next until a release is meant as the default install)
        required: true
        default: next
        type: string
      dry_run:
        description: Dry run (npm publish --dry-run)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-sdk
  cancel-in-progress: false

# Actions are pinned to commit SHAs (supply-chain safety); the comment gives the tag.
jobs:
  gate:
    name: Check the publish token
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.token.outputs.ready }}
    steps:
      - id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not set: nothing is published (docs/operations.md, Releasing the SDK packages)."
          fi

  publish:
    name: Build, check and publish
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      VERSION: ${{ inputs.version }}
      DIST_TAG: ${{ inputs.dist_tag }}
      DRY_RUN: ${{ inputs.dry_run }}
      # Decision pending (docs/operations.md): "public" for a public @hana-id npm org, "restricted" for a private one.
      NPM_ACCESS: restricted
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Publish from main only (this run is on $GITHUB_REF)."
          exit 1
      - name: Check the inputs
        run: |
          echo "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' || { echo "::error::version must be x.y.z or x.y.z-pre"; exit 1; }
          echo "$DIST_TAG" | grep -Eq '^[a-z][a-z0-9-]{0,31}$' || { echo "::error::dist_tag must be a lower-case tag name"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          # Decision pending: the registry. npmjs.org for a public or private @hana-id org.
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The four packages are at the requested version
        run: |
          for p in core web react sodax; do
            v=$(node -p "require('./packages/$p/package.json').version")
            [ "$v" = "$VERSION" ] || { echo "::error::@hana-id/$p is at $v, not $VERSION (pnpm --filter @hana-id/scripts sdk-version $VERSION)"; exit 1; }
          done
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm run pack:check
      # pnpm pack (prepack runs build:lib) rewrites workspace:^ and applies publishConfig; npm publishes the tarballs
      # in dependency order.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          for p in core web react sodax; do
            (cd "packages/$p" && pnpm pack --pack-destination "$RUNNER_TEMP/packs")
          done
          ls -l "$RUNNER_TEMP/packs"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          flags="--provenance --access $NPM_ACCESS --tag $DIST_TAG"
          [ "$DRY_RUN" = "true" ] && flags="$flags --dry-run"
          for p in core web react sodax; do
            npm publish "$RUNNER_TEMP/packs/hana-id-$p-$VERSION.tgz" $flags
          done
