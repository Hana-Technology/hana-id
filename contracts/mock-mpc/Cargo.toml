[package]
name = "mock-mpc"
description = "Test-only stand-in for the NEAR MPC signer's CKD method (request_app_private_key). Never deploy outside a sandbox."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.9"
serde = { version = "1", features = ["derive"] }
borsh = { version = "1.3.1", features = ["unstable__schema"] }
schemars = "0.8.16"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Standalone crate (not part of any parent workspace).
[workspace]
